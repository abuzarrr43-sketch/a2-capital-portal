<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2 Capital</title>
<meta name="theme-color" content="#f4efe4">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{
    --bg:#f4efe4; --panel:#ebe4d4; --panel-2:#e2d9c6;
    --border:#d4cbb8; --border-soft:#d9d0bd;
    --text:#1c1914; --text-dim:#6b6458; --text-faint:#8a8274;
    --green:#1f6b45; --green-dim:#dce8df;
    --red:#9b3d32; --red-dim:#ead8d4;
    --amber:#9a6b20; --amber-dim:#eadcc4;
    --accent:#1f6b45;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100%;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .display{font-family:'Fraunces',Georgia,serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  button,input,select,textarea{font:inherit;color:inherit;}
  button:not(:disabled){cursor:pointer;}
  .app{max-width:1100px;margin:0 auto;padding:20px 18px 80px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 16px;margin-bottom:22px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{width:32px;height:32px;border:1px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:13px;flex-shrink:0;background:transparent;}
  .brand-name{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:16px;}
  .topbar-right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-faint);}
  .btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:4px;font-size:13px;font-weight:500;min-height:44px;}
  .btn:hover{background:#ddd4c0;}
  .btn-primary{background:var(--green);color:#f4efe4;border-color:var(--green);}
  .btn-primary:hover{background:#185536;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);background:var(--panel);}
  .btn-sm{padding:8px 12px;font-size:12px;min-height:40px;}
  .btn-danger{color:var(--red);border-color:transparent;background:transparent;}
  .btn-amber{background:var(--amber);color:#f4efe4;border-color:var(--amber);}
  input,select,textarea{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:4px;font-size:16px;width:100%;outline:none;min-height:44px;}
  textarea{min-height:88px;resize:vertical;}
  input:focus,select:focus,textarea:focus{border-color:var(--green);}
  label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;font-weight:500;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;min-width:0;}
  .badge-30{font-size:11px;color:var(--text-faint);margin-left:6px;}
  .login-wrap{min-height:100dvh;display:flex;flex-direction:column;}
  .login-brandbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .login-card{width:100%;max-width:400px;margin:0 auto;padding:28px 20px 40px;flex:1;}
  .login-header{margin-bottom:22px;}
  .login-header h1{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:500;margin-bottom:4px;}
  .login-header p{font-size:14px;color:var(--text-dim);}
  .role-toggle{display:flex;gap:20px;margin-bottom:22px;border-bottom:1px solid var(--border);}
  .role-toggle button{flex:0;padding:10px 0;border:none;background:transparent;color:var(--text-dim);font-size:14px;font-weight:500;border-bottom:2px solid transparent;border-radius:0;min-height:44px;}
  .role-toggle button.active{color:var(--text);border-bottom-color:var(--green);}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;}
  .login-note{font-size:11px;color:var(--text-faint);margin-top:18px;}
  @media(min-width:900px){
    .login-wrap{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;}
    .login-brandbar{flex-direction:column;align-items:flex-start;justify-content:space-between;padding:56px;border-bottom:0;border-right:1px solid var(--border);}
    .login-brandbar .desk-copy{display:block;}
    .login-card{display:flex;flex-direction:column;justify-content:center;padding:56px;}
  }
  .desk-copy{display:none;}
  .desk-copy .big{font-family:'Fraunces',Georgia,serif;font-size:96px;line-height:1;font-weight:500;margin-top:24px;}
  .desk-copy .sub{font-family:'Fraunces',Georgia,serif;font-size:48px;color:var(--green);}
  .layout{display:grid;grid-template-columns:1fr;gap:20px;align-items:start;}
  .sidebar{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;}
  .sidebar-title{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);padding:6px 8px 10px;font-weight:600;}
  .client-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px;cursor:pointer;border-left:2px solid transparent;min-height:56px;}
  .client-item:hover{background:var(--panel);}
  .client-item.active{background:var(--panel);border-left-color:var(--green);}
  .client-item.inactive-client{opacity:0.5;}
  .client-item .nm{font-size:15px;font-weight:500;font-family:'Fraunces',Georgia,serif;}
  .client-item .bal{font-size:12px;color:var(--text-dim);}
  .badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;margin-left:4px;}
  .badge-inactive{background:var(--red-dim);color:var(--red);}
  .badge-req{background:var(--amber-dim);color:var(--amber);}
  .panel{border-top:1px solid var(--border);padding:28px 0;}
  .panel:first-child{border-top:none;padding-top:0;}
  .panel-title{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);font-weight:500;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .panel-title .sub{font-size:11px;color:var(--text-faint);font-weight:400;letter-spacing:0;text-transform:none;}
  .stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin-bottom:8px;}
  @media(min-width:700px){.stat-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}}
  .stat-card{min-width:0;}
  .stat-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:500;font-family:'Fraunces',Georgia,serif;overflow-wrap:anywhere;}
  .stat-value.green{color:var(--green);}
  .hero-bal{font-size:clamp(36px,8vw,60px);line-height:1;font-weight:500;font-family:'Fraunces',Georgia,serif;margin:4px 0 10px;}
  .stmt-line{height:140px;width:100%;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:22px 0;}
  .stmt-line svg{width:100%;height:100%;display:block;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;padding:8px 8px 8px 0;border-bottom:1px solid var(--border);}
  td{padding:12px 8px 12px 0;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 8px;border-radius:3px;font-size:12px;font-weight:600;}
  .pill.up,.pill.approved{background:var(--green-dim);color:var(--green);}
  .pill.down,.pill.rejected{background:var(--red-dim);color:var(--red);}
  .pill.pending{background:var(--amber-dim);color:var(--amber);}
  .empty{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:13px;}
  .modal-bg{position:fixed;inset:0;background:rgba(28,25,20,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;}
  @media(min-width:640px){.modal-bg{align-items:center;}}
  .modal{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:24px;width:100%;max-width:420px;max-height:90dvh;overflow-y:auto;}
  .modal h3{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:500;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .chat-box{display:flex;flex-direction:column;height:320px;}
  .chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .msg-row{display:flex;}
  .msg-row.mine{justify-content:flex-end;}
  .msg{max-width:78%;padding:9px 13px;border-radius:8px;font-size:14px;background:var(--panel-2);}
  .msg.mine{background:var(--green-dim);}
  .msg.theirs{background:var(--panel);}
  .msg-time{font-size:10px;color:var(--text-faint);margin-top:4px;}
  .chat-input-row{display:flex;gap:8px;margin-top:12px;}
  .req-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .ticket{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;max-width:280px;}
  .ticket-header{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
  .ticket-amount{font-size:18px;font-family:'IBM Plex Mono',monospace;margin-bottom:6px;}
  .ticket-amount.deposit{color:var(--green);}
  .ticket-amount.withdrawal{color:var(--amber);}
  .ticket-actions{display:flex;gap:6px;margin-top:10px;}
  .ledger-cards{display:none;}
  .menu-btn{display:inline-flex;}
  .sheet{display:none;}
  .sheet.open{display:block;position:fixed;inset:0;z-index:40;background:rgba(28,25,20,.4);}
  .sheet-panel{width:min(320px,90vw);height:100%;background:var(--bg);padding:16px;overflow:auto;}
  @media(max-width:759px){
    .hide-sm{display:none !important;}
    .ledger-cards{display:block;}
    .ledger-cards li{padding:12px 0;border-bottom:1px solid var(--border);}
    .row{flex-direction:column;}
  }
  @media(min-width:760px){
    .menu-btn{display:none;}
    .sheet{display:none !important;}
  }
  @media(min-width:960px){
    .layout{grid-template-columns:17rem 1fr;gap:32px;}
    .sidebar{position:sticky;top:16px;border-right:1px solid var(--border);border-left:0;border-top:0;border-bottom:0;border-radius:0;padding-right:16px;}
  }
  @media(max-width:959px){
    .desk-sidebar{display:none;}
  }
</style>

<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://sdqxwbyekidctoumosgk.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcXh3Ynlla2lkY3RvdW1vc2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTYzOTIsImV4cCI6MjA5ODM5MjM5Mn0.OwO8v7GsO2qj7OIP10MU07B-2caT610zYfASCfJGp8Y';
async function sGet(key){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/portal_data?key=eq.${encodeURIComponent(key)}&select=value`,
      {headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
    const rows=await res.json();
    return(rows&&rows.length)?rows[0].value:null;
  }catch(e){console.error('storage get failed',e);return null;}
}
async function sSet(key,value){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/portal_data`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{key,value}])
    });
    return res.ok;
  }catch(e){console.error('storage set failed',e);return false;}
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
let state={
  view:'login',loginRole:'admin',loginError:'',
  adminConfigured:null,clients:[],currentClientId:null,loggedClient:null,
  records:{},chats:{},transactions:{},modal:null,listOpen:false
};
function render(){window.__render();}
async function loadAdminConfig(){state.adminConfigured=await sGet('admin-config');}
async function loadClients(){state.clients=(await sGet('clients'))||[];}
async function loadRecords(id){state.records[id]=(await sGet('records:'+id))||[];}
async function loadChat(id){state.chats[id]=(await sGet('chat:'+id))||[];}
async function loadTransactions(id){state.transactions[id]=(await sGet('transactions:'+id))||[];}
function computeLedger(client){
  const cPct=(client.clientProfitPct!=null)?client.clientProfitPct:70;
  const own=client.ownerType||'shared';
  const aSplit=(client.splitAbuzarPct!=null)?client.splitAbuzarPct:50;
  const profitRecs=(state.records[client.id]||[])
    .map(r=>({...r,_ev:'profit'}))
    .sort((a,b)=>(a.dateFrom||a.date||'').localeCompare(b.dateFrom||b.date||'')||(a.addedAt||0)-(b.addedAt||0));
  const approvedTxns=(state.transactions[client.id]||[])
    .filter(t=>t.status==='approved')
    .map(t=>({...t,_ev:'txn'}));
  const all=[...profitRecs,...approvedTxns].sort((a,b)=>{
    const at=a._ev==='profit'?(a.addedAt||0):(a.processedAt||0);
    const bt=b._ev==='profit'?(b.addedAt||0):(b.processedAt||0);
    return at-bt;
  });
  let bal=client.initialDeposit,abPool=0,azPool=0,totalCProfit=0;
  const ledger=[];
  all.forEach(ev=>{
    if(ev._ev==='profit'){
      const before=bal,abBefore=abPool,azBefore=azPool,rate=ev.pct/100;
      const gross=before*rate,cGain=gross*(cPct/100),admin=gross-cGain;
      let abShare=0,azShare=0;
      if(own==='abuzar')abShare=admin;
      else if(own==='azfar')azShare=admin;
      else{abShare=admin*(aSplit/100);azShare=admin*(1-aSplit/100);}
      bal=before+cGain;
      abPool=abBefore*(1+rate)+abShare;
      azPool=azBefore*(1+rate)+azShare;
      totalCProfit+=cGain;
      ledger.push({_ev:'profit',...ev,before,gross,cGain,after:bal,abBefore,abShare,abAfter:abPool,azBefore,azShare,azAfter:azPool});
    } else {
      const before=bal;
      if(ev.type==='deposit')bal+=ev.amount;
      else if(ev.type==='withdrawal')bal=Math.max(0,bal-ev.amount);
      ledger.push({_ev:'txn',...ev,before,after:bal});
    }
  });
  return{ledger,currentBalance:bal,totalCProfit,abPool,azPool,cPct,own,aSplit};
}
function fmtM(n){return'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtP(n){return(n>=0?'+':'')+Number(n).toFixed(2)+'%';}
function fmtS(d){if(!d)return'';const[y,m,day]=d.split('-');return parseInt(day,10)+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m,10)-1]+' '+y;}
function fmtFull(d){if(!d)return'';const[y,m,day]=d.split('-');return parseInt(day,10)+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][parseInt(m,10)-1]+' '+y;}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function todayISO(){return new Date().toISOString().slice(0,10);}
function chartSVG(client,calc){
  const chrono=calc.ledger.filter(r=>r._ev==='profit');
  const data=[{v:client.initialDeposit}].concat(chrono.map(r=>({v:r.after})));
  if(data.length<2)return'';
  const w=360,h=120,pad=8;
  const vs=data.map(d=>d.v);
  const min=Math.min.apply(null,vs),max=Math.max.apply(null,vs);
  const span=max-min||1;
  const pts=data.map((d,i)=>{
    const x=pad+(i/(data.length-1))*(w-pad*2);
    const y=pad+(1-(d.v-min)/span)*(h-pad*2);
    return x+','+y;
  }).join(' ');
  return `<div class="stmt-line"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="#1f6b45" stroke-width="1.75" points="${pts}"/></svg></div>`;
}
function clientListHTML(){
  let sh=`<div class="sidebar-title">Clients (${state.clients.length})</div>`;
  if(!state.clients.length){sh+=`<div class="empty" style="padding:20px 8px;">No clients yet.</div>`;}
  else{
    state.clients.forEach(c=>{
      const calc=state.records[c.id]?computeLedger(c):null;
      const bal=calc?calc.currentBalance:c.initialDeposit;
      const inactive=calc&&calc.currentBalance<=0;
      const ow=c.ownerType||'shared';
      const owT=ow==='abuzar'?'Abuzar':ow==='azfar'?'Azfar':'Shared';
      const pending=(state.transactions[c.id]||[]).filter(t=>t.status==='pending').length;
      const profitEvs=calc?calc.ledger.filter(r=>r._ev==='profit'):[];
      const lastPctStr=profitEvs.length?`<span class="mono" style="font-size:11px;font-weight:500;color:${profitEvs[profitEvs.length-1].pct>=0?'var(--green)':'var(--red)'}">${fmtP(profitEvs[profitEvs.length-1].pct)}</span>`:'';
      sh+=`<div class="client-item ${state.currentClientId===c.id?'active':''} ${inactive?'inactive-client':''}" data-id="${c.id}">
        <div style="flex:1;min-width:0;">
          <div class="nm">${esc(c.name)}${inactive?'<span class="badge badge-inactive">Inactive</span>':''}${pending?`<span class="badge badge-req">${pending} req</span>`:''}</div>
          <div class="bal mono">${fmtM(bal)} <span style="font-size:10px;color:var(--text-faint);">· ${owT}</span></div>
        </div>${lastPctStr}</div>`;
    });
  }
  sh+=`<button class="btn btn-primary btn-sm" id="acb" style="width:100%;margin-top:10px;">Add client</button>`;
  return sh;
}
function ViewLogin(){
  const wrap=document.createElement('div');wrap.className='login-wrap';
  wrap.innerHTML=`
    <aside class="login-brandbar">
      <div class="brand"><div class="brand-mark">A2</div><div class="brand-name">A2 <span style="color:var(--green)">Capital</span></div></div>
      <div class="desk-copy">
        <p class="kicker">Private account</p>
        <p class="big">A2</p>
        <p class="sub">Capital</p>
        <p style="color:var(--text-dim);max-width:280px;margin-top:20px;">Your balance, week by week.</p>
      </div>
    </aside>
    <div class="login-card">
      <div class="login-header"><h1>Sign in</h1><p>Admin desk or client account.</p></div>
      <div class="role-toggle">
        <button data-role="admin" class="${state.loginRole==='admin'?'active':''}">Admin</button>
        <button data-role="client" class="${state.loginRole==='client'?'active':''}">Client</button>
      </div>
      <div id="lf"></div>
      <div class="login-error">${state.loginError||''}</div>
      <div class="login-note">Keep your passcode private.</div>
    </div>`;
  wrap.querySelectorAll('[data-role]').forEach(b=>{b.onclick=()=>{state.loginRole=b.dataset.role;state.loginError='';render();};});
  const lf=wrap.querySelector('#lf');
  if(state.loginRole==='admin'){
    if(!state.adminConfigured){
      lf.innerHTML=`
        <div class="field"><label>Set admin passcode</label><input id="p1" type="password" placeholder="Choose a passcode"></div>
        <div class="field"><label>Confirm passcode</label><input id="p2" type="password" placeholder="Re-enter passcode"></div>
        <button class="btn btn-primary" id="sb" style="width:100%">Create admin account</button>`;
      lf.querySelector('#sb').onclick=async()=>{
        const p1=lf.querySelector('#p1').value.trim(),p2=lf.querySelector('#p2').value.trim();
        if(!p1||p1.length<4){state.loginError='Passcode must be at least 4 characters.';render();return;}
        if(p1!==p2){state.loginError='Passcodes do not match.';render();return;}
        await sSet('admin-config',{passcode:p1});
        state.adminConfigured={passcode:p1};state.loginError='';render();
      };
    } else {
      lf.innerHTML=`
        <div class="field"><label>Passcode</label><input id="ap" type="password" placeholder="Enter passcode"></div>
        <button class="btn btn-primary" id="lb" style="width:100%">Log in</button>`;
      const go=async()=>{
        if(lf.querySelector('#ap').value.trim()===state.adminConfigured.passcode){
          state.view='admin';state.loginError='';
          await loadClients();
          await Promise.all(state.clients.map(c=>Promise.all([loadRecords(c.id),loadChat(c.id),loadTransactions(c.id)])));
          render();
        } else {state.loginError='Incorrect passcode.';render();}
      };
      lf.querySelector('#lb').onclick=go;
      lf.querySelector('#ap').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    }
  } else {
    lf.innerHTML=`
      <div class="field"><label>Email</label><input id="ce" type="email" placeholder="name@email.com"></div>
      <div class="field"><label>Passcode</label><input id="cp" type="password" placeholder="Passcode from your advisor"></div>
      <button class="btn btn-primary" id="clb" style="width:100%">Log in</button>`;
    const go=async()=>{
      const em=lf.querySelector('#ce').value.trim().toLowerCase(),pw=lf.querySelector('#cp').value.trim();
      await loadClients();
      const m=state.clients.find(c=>c.email.toLowerCase()===em&&c.passcode===pw);

    main.appendChild(hint);

  return host;

      await sSet('clients',updated);
      state.modal=null;state.currentClientId=nc.id;
      await loadRecords(nc.id);await loadChat(nc.id);await loadTransactions(nc.id);
      render();
    };
  }
  else if(state.modal==='editClient'){
    const cl=state.clients.find(c=>c.id===state.currentClientId);
    const cp=cl.clientProfitPct??70,co=cl.ownerType||'shared',cs=cl.splitAbuzarPct??50;
    modal.innerHTML=`<h3>Edit ${esc(cl.name)}</h3>
      <div class="field"><label>Full name</label><input id="mn" value="${esc(cl.name)}"></div>
      <div class="field"><label>Email</label><input id="me" value="${esc(cl.email)}"></div>
      <div class="field"><label>Phone</label><input id="mph" value="${esc(cl.phone||'')}"></div>
      <div class="field"><label>Client passcode</label><input id="mp" value="${esc(cl.passcode)}"></div>
      <div class="field"><label>Client profit share (%)</label><input id="mc" type="number" step="0.1" min="0" max="100" value="${cp}"></div>
      <div class="field"><label>Whose client?</label>
        <select id="mo"><option value="shared" ${co==='shared'?'selected':''}>Shared (Abuzar + Azfar)</option><option value="abuzar" ${co==='abuzar'?'selected':''}>Abuzar only</option><option value="azfar" ${co==='azfar'?'selected':''}>Azfar only</option></select>
      </div>
      <div class="field" id="sw"><label>Abuzar's share of the cut (%)</label><input id="ms" type="number" step="0.1" min="0" max="100" value="${cs}"></div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="m-delete" style="flex:1">Remove client</button>
        <button class="btn btn-primary" id="m-save" style="flex:1">Save</button>
      </div>
      <button class="btn btn-ghost" id="m-cancel" style="width:100%;margin-top:10px;">Cancel</button>`;
    const os2=modal.querySelector('#mo'),sw2=modal.querySelector('#sw');
    const tog2=()=>{sw2.style.display=os2.value==='shared'?'block':'none';};
    os2.addEventListener('change',tog2);tog2();
    modal.querySelector('#m-save').onclick=async()=>{
      const cPct=parseFloat(modal.querySelector('#mc').value);
      const spl=parseFloat(modal.querySelector('#ms').value)||50;
      if(isNaN(cPct)||cPct<0||cPct>100){alert('Profit share must be 0-100.');return;}
      cl.name=modal.querySelector('#mn').value.trim();
      cl.email=modal.querySelector('#me').value.trim();
      cl.phone=modal.querySelector('#mph').value.trim();
      cl.passcode=modal.querySelector('#mp').value.trim();
      cl.clientProfitPct=cPct;cl.ownerType=modal.querySelector('#mo').value;cl.splitAbuzarPct=spl;
      await sSet('clients',state.clients);state.modal=null;render();
    };
    modal.querySelector('#m-delete').onclick=async()=>{
      if(!confirm('Remove this client?'))return;
      state.clients=state.clients.filter(c=>c.id!==cl.id);
      await sSet('clients',state.clients);
      state.modal=null;state.currentClientId=null;render();
    };
  }
  modal.querySelector('#m-cancel')?.addEventListener('click',()=>{state.modal=null;render();});
  bg.appendChild(modal);return bg;
}
window.__render=function(){
  const root=document.getElementById('root');root.innerHTML='';
  let view;
  if(state.view==='login')view=ViewLogin();
  else if(state.view==='admin')view=ViewAdmin();
  else if(state.view==='client')view=ViewClient();
  root.appendChild(view);
  const m=renderModal();if(m)root.appendChild(m);
};
(async function init(){await loadAdminConfig();render();})();
</script>
</body>
</html>
