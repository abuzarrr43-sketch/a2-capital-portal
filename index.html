<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2 Capital</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --bg:#0B0F14; --panel:#11161D; --panel-2:#161D26; --border:#232C38; --border-soft:#1A222C;
    --text:#E7ECF2; --text-dim:#8B97A8; --text-faint:#5C6878;
    --green:#1FD17C; --green-dim:#163024; --red:#FF6B6B; --red-dim:#2E1818;
    --amber:#F5A623; --amber-dim:#2E2010; --accent:#3D8BFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;line-height:1.5;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .app{max-width:1100px;margin:0 auto;padding:24px 20px 80px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--border-soft);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(180deg,var(--green),#14A862);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;letter-spacing:-0.3px;color:#06140D;}
  .brand-name{font-weight:600;font-size:15px;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-dim);}
  .btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s,background .15s;}
  .btn:hover{border-color:#34404F;background:#1A222C;}
  .btn-primary{background:var(--green);color:#06140D;border-color:var(--green);}
  .btn-primary:hover{background:#28DB87;border-color:#28DB87;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);background:var(--panel-2);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-danger{color:var(--red);border-color:#3A2222;}
  .btn-amber{background:var(--amber);color:#1A0E00;border-color:var(--amber);}
  .btn-amber:hover{background:#F7B84A;}
  input,select,textarea{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;width:100%;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;font-weight:500;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .badge-30{font-size:11px;color:var(--text-faint);margin-left:6px;}
  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:32px 28px;}
  .login-header{text-align:center;margin-bottom:28px;}
  .login-header .brand-mark{margin:0 auto 14px;width:42px;height:42px;border-radius:10px;font-size:15px;}
  .login-header h1{font-size:18px;font-weight:600;margin-bottom:4px;}
  .login-header p{font-size:13px;color:var(--text-dim);}
  .role-toggle{display:flex;gap:8px;margin-bottom:22px;background:var(--panel-2);padding:4px;border-radius:9px;border:1px solid var(--border);}
  .role-toggle button{flex:1;padding:8px;border-radius:6px;border:none;background:transparent;color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
  .role-toggle button.active{background:var(--bg);color:var(--text);border:1px solid var(--border);}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center;}
  .login-note{font-size:11px;color:var(--text-faint);text-align:center;margin-top:18px;line-height:1.5;}
  /* Layout */
  .layout{display:grid;grid-template-columns:265px 1fr;gap:20px;align-items:start;}
  @media(max-width:760px){.layout{grid-template-columns:1fr;}}
  .sidebar{background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:14px;position:sticky;top:20px;}
  .sidebar-title{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);padding:6px 8px 10px;font-weight:600;}
  .client-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;}
  .client-item:hover{background:var(--panel-2);}
  .client-item.active{background:var(--panel-2);border-color:var(--border);}
  .client-item.inactive-client{opacity:0.5;}
  .client-item .nm{font-size:13.5px;font-weight:500;}
  .client-item .bal{font-size:11.5px;color:var(--text-dim);}
  .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600;margin-left:4px;}
  .badge-inactive{background:var(--red-dim);color:var(--red);}
  .badge-req{background:var(--amber-dim);color:var(--amber);}
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:22px;}
  .panel+.panel{margin-top:18px;}
  .panel-title{font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .panel-title .sub{font-size:11px;color:var(--text-faint);font-weight:400;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .stat-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .stat-value{font-size:21px;font-weight:600;}
  .stat-value.green{color:var(--green);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
  td{padding:11px 10px;border-bottom:1px solid var(--border-soft);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.up{background:var(--green-dim);color:var(--green);}
  .pill.down{background:var(--red-dim);color:var(--red);}
  .pill.pending{background:var(--amber-dim);color:var(--amber);}
  .pill.approved{background:var(--green-dim);color:var(--green);}
  .pill.rejected{background:var(--red-dim);color:var(--red);}
  .empty{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:13px;}
  /* Modals */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:26px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:15px;font-weight:600;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  /* Chat */
  .chat-box{display:flex;flex-direction:column;height:380px;}
  .chat-msgs{flex:1;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:10px;}
  .msg-row{display:flex;}
  .msg-row.mine{justify-content:flex-end;}
  .msg{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;}
  .msg.mine{background:var(--green-dim);color:#CFFCE6;border-bottom-right-radius:3px;}
  .msg.theirs{background:var(--panel-2);border:1px solid var(--border);border-bottom-left-radius:3px;}
  .msg-time{font-size:10px;color:var(--text-faint);margin-top:4px;}
  .chat-input-row{display:flex;gap:8px;margin-top:12px;}
  .req-btns{display:flex;gap:8px;margin-bottom:14px;}
  /* Ticket */
  .ticket{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-width:280px;}
  .ticket-header{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
  .ticket-amount{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
  .ticket-amount.deposit{color:var(--green);}
  .ticket-amount.withdrawal{color:var(--amber);}
  .ticket-actions{display:flex;gap:6px;margin-top:10px;}
  .txn-dep td{background:rgba(31,209,124,.03);}
  .txn-wd td{background:rgba(255,107,107,.03);}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://sdqxwbyekidctoumosgk.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcXh3Ynlla2lkY3RvdW1vc2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTYzOTIsImV4cCI6MjA5ODM5MjM5Mn0.OwO8v7GsO2qj7OIP10MU07B-2caT610zYfASCfJGp8Y';

async function sGet(key){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/portal_data?key=eq.${encodeURIComponent(key)}&select=value`,
      {headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
    const rows=await res.json();
    return(rows&&rows.length)?rows[0].value:null;
  }catch(e){console.error('storage get failed',e);return null;}
}
async function sSet(key,value){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/portal_data`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{key,value}])
    });
    return res.ok;
  }catch(e){console.error('storage set failed',e);return false;}
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}

let state={
  view:'login',loginRole:'admin',loginError:'',
  adminConfigured:null,clients:[],currentClientId:null,loggedClient:null,
  records:{},chats:{},transactions:{},modal:null
};
function render(){window.__render();}

async function loadAdminConfig(){state.adminConfigured=await sGet('admin-config');}
async function loadClients(){state.clients=(await sGet('clients'))||[];}
async function loadRecords(id){state.records[id]=(await sGet('records:'+id))||[];}
async function loadChat(id){state.chats[id]=(await sGet('chat:'+id))||[];}
async function loadTransactions(id){state.transactions[id]=(await sGet('transactions:'+id))||[];}

function computeLedger(client){
  const cPct=(client.clientProfitPct!=null)?client.clientProfitPct:70;
  const own=client.ownerType||'shared';
  const aSplit=(client.splitAbuzarPct!=null)?client.splitAbuzarPct:50;

  const profitRecs=(state.records[client.id]||[])
    .map(r=>({...r,_ev:'profit'}))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.addedAt||0)-(b.addedAt||0));

  const approvedTxns=(state.transactions[client.id]||[])
    .filter(t=>t.status==='approved')
    .map(t=>({...t,_ev:'txn'}));

  const all=[...profitRecs,...approvedTxns].sort((a,b)=>{
    const at=a._ev==='profit'?(a.addedAt||0):(a.processedAt||0);
    const bt=b._ev==='profit'?(b.addedAt||0):(b.processedAt||0);
    return at-bt;
  });

  let bal=client.initialDeposit,abPool=0,azPool=0,totalCProfit=0;
  const ledger=[];

  all.forEach(ev=>{
    if(ev._ev==='profit'){
      const before=bal,abBefore=abPool,azBefore=azPool,rate=ev.pct/100;
      const gross=before*rate,cGain=gross*(cPct/100),admin=gross-cGain;
      let abShare=0,azShare=0;
      if(own==='abuzar')abShare=admin;
      else if(own==='azfar')azShare=admin;
      else{abShare=admin*(aSplit/100);azShare=admin*(1-aSplit/100);}
      bal=before+cGain;
      abPool=abBefore*(1+rate)+abShare;
      azPool=azBefore*(1+rate)+azShare;
      totalCProfit+=cGain;
      ledger.push({_ev:'profit',...ev,before,gross,cGain,after:bal,abBefore,abShare,abAfter:abPool,azBefore,azShare,azAfter:azPool});
    } else {
      const before=bal;
      if(ev.type==='deposit')bal+=ev.amount;
      else if(ev.type==='withdrawal')bal=Math.max(0,bal-ev.amount);
      ledger.push({_ev:'txn',...ev,before,after:bal});
    }
  });
  return{ledger,currentBalance:bal,totalCProfit,abPool,azPool,cPct,own,aSplit};
}

function fmtM(n){'use strict';return'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtP(n){return(n>=0?'+':'')+Number(n).toFixed(2)+'%';}
function mName(m){return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ===== LOGIN ===== */
function ViewLogin(){
  const wrap=document.createElement('div');wrap.className='login-wrap';
  wrap.innerHTML=`<div class="login-card">
    <div class="login-header">
      <div class="brand-mark">A2</div>
      <h1>A2 Capital</h1>
      <p>Track your account, week by week</p>
    </div>
    <div class="role-toggle">
      <button data-role="admin" class="${state.loginRole==='admin'?'active':''}">Admin</button>
      <button data-role="client" class="${state.loginRole==='client'?'active':''}">Client</button>
    </div>
    <div id="lf"></div>
    <div class="login-error">${state.loginError||''}</div>
    <div class="login-note">Your data is stored securely. Keep your passcode private.</div>
  </div>`;
  wrap.querySelectorAll('[data-role]').forEach(b=>{b.onclick=()=>{state.loginRole=b.dataset.role;state.loginError='';render();};});
  const lf=wrap.querySelector('#lf');

  if(state.loginRole==='admin'){
    if(!state.adminConfigured){
      lf.innerHTML=`
        <div class="field"><label>Set admin passcode</label><input id="p1" type="password" placeholder="Choose a passcode"></div>
        <div class="field"><label>Confirm passcode</label><input id="p2" type="password" placeholder="Re-enter passcode"></div>
        <button class="btn btn-primary" id="sb" style="width:100%">Create admin account</button>`;
      lf.querySelector('#sb').onclick=async()=>{
        const p1=lf.querySelector('#p1').value.trim(),p2=lf.querySelector('#p2').value.trim();
        if(!p1||p1.length<4){state.loginError='Passcode must be at least 4 characters.';render();return;}
        if(p1!==p2){state.loginError='Passcodes do not match.';render();return;}
        await sSet('admin-config',{passcode:p1});
        state.adminConfigured={passcode:p1};state.loginError='';render();
      };
    } else {
      lf.innerHTML=`
        <div class="field"><label>Passcode</label><input id="ap" type="password" placeholder="Enter passcode"></div>
        <button class="btn btn-primary" id="lb" style="width:100%">Log in</button>`;
      const go=async()=>{
        if(lf.querySelector('#ap').value.trim()===state.adminConfigured.passcode){
          state.view='admin';state.loginError='';
          await loadClients();
          await Promise.all(state.clients.map(c=>Promise.all([loadRecords(c.id),loadChat(c.id),loadTransactions(c.id)])));
          render();
        } else {state.loginError='Incorrect passcode.';render();}
      };
      lf.querySelector('#lb').onclick=go;
      lf.querySelector('#ap').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    }
  } else {
    lf.innerHTML=`
      <div class="field"><label>Email</label><input id="ce" type="email" placeholder="name@email.com"></div>
      <div class="field"><label>Passcode</label><input id="cp" type="password" placeholder="Passcode from your advisor"></div>
      <button class="btn btn-primary" id="clb" style="width:100%">Log in</button>`;
    const go=async()=>{
      const em=lf.querySelector('#ce').value.trim().toLowerCase(),pw=lf.querySelector('#cp').value.trim();
      await loadClients();
      const m=state.clients.find(c=>c.email.toLowerCase()===em&&c.passcode===pw);
      if(m){
        state.loggedClient=m;state.view='client';state.loginError='';
        await loadRecords(m.id);await loadChat(m.id);await loadTransactions(m.id);render();
      } else {state.loginError='No match. Check your email and passcode.';render();}
    };
    lf.querySelector('#clb').onclick=go;
    lf.querySelector('#cp').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  }
  return wrap;
}

/* ===== ADMIN ===== */
function ViewAdmin(){
  const wrap=document.createElement('div');wrap.className='app';
  const top=document.createElement('div');top.className='topbar';
  top.innerHTML=`
    <div class="brand"><div class="brand-mark">A2</div><div class="brand-name">A2 Capital \u2014 Admin</div></div>
    <div class="topbar-right"><span>Admin</span><button class="btn btn-ghost btn-sm" id="lo">Log out</button></div>`;
  top.querySelector('#lo').onclick=()=>{state.view='login';state.currentClientId=null;render();};
  wrap.appendChild(top);

  const layout=document.createElement('div');layout.className='layout';
  const sidebar=document.createElement('div');sidebar.className='sidebar';

  let sh=`<div class="sidebar-title">Clients (${state.clients.length})</div>`;
  if(!state.clients.length){sh+=`<div class="empty" style="padding:20px 8px;">No clients yet.</div>`;}
  else{
    state.clients.forEach(c=>{
      const calc=state.records[c.id]?computeLedger(c):null;
      const bal=calc?calc.currentBalance:c.initialDeposit;
      const inactive=calc&&calc.currentBalance<=0;
      const ow=c.ownerType||'shared';
      const owT=ow==='abuzar'?'Abuzar':ow==='azfar'?'Azfar':'Shared';
      const pending=(state.transactions[c.id]||[]).filter(t=>t.status==='pending').length;
      const profitEvs=calc?calc.ledger.filter(r=>r._ev==='profit'):[];
      const lastPctStr=profitEvs.length?`<span style="font-size:11px;font-weight:600;color:${profitEvs[profitEvs.length-1].pct>=0?'var(--green)':'var(--red)'}">${fmtP(profitEvs[profitEvs.length-1].pct)}</span>`:'';
      sh+=`<div class="client-item ${state.currentClientId===c.id?'active':''} ${inactive?'inactive-client':''}" data-id="${c.id}">
        <div style="flex:1;min-width:0;">
          <div class="nm">${esc(c.name)}${inactive?'<span class="badge badge-inactive">INACTIVE</span>':''}${pending?`<span class="badge badge-req">${pending} REQ</span>`:''}</div>
          <div class="bal mono">${fmtM(bal)} <span style="font-size:10px;color:var(--text-faint);">\u00b7 ${owT}</span></div>
        </div>${lastPctStr}</div>`;
    });
  }
  sidebar.innerHTML=sh;
  sidebar.innerHTML+=`<button class="btn btn-primary btn-sm" id="acb" style="width:100%;margin-top:10px;">+ Add client</button>`;
  layout.appendChild(sidebar);

  const main=document.createElement('div');
  const allC=state.clients.map(c=>state.records[c.id]?computeLedger(c):null);
  const totalAUM=state.clients.reduce((s,c,i)=>s+(allC[i]?allC[i].currentBalance:c.initialDeposit),0);
  const totalAb=allC.reduce((s,c)=>s+(c?c.abPool:0),0);
  const totalAz=allC.reduce((s,c)=>s+(c?c.azPool:0),0);
  const totalCP=allC.reduce((s,c)=>s+(c?c.totalCProfit:0),0);
  const activeCount=state.clients.filter(c=>{const cl=state.records[c.id]?computeLedger(c):null;return!cl||cl.currentBalance>0;}).length;

  const ov=document.createElement('div');ov.className='panel';
  ov.innerHTML=`<div class="panel-title">Overview</div><div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Assets under management</div><div class="stat-value mono">${fmtM(totalAUM)}</div></div>
    <div class="stat-card"><div class="stat-label">Client profit distributed</div><div class="stat-value green mono">${fmtM(totalCP)}</div></div>
    <div class="stat-card"><div class="stat-label">Abuzar's pool</div><div class="stat-value green mono">${fmtM(totalAb)}</div></div>
    <div class="stat-card"><div class="stat-label">Azfar's pool</div><div class="stat-value green mono">${fmtM(totalAz)}</div></div>
    <div class="stat-card"><div class="stat-label">Active clients</div><div class="stat-value">${activeCount}</div></div>
  </div>`;
  main.appendChild(ov);

  if(state.currentClientId){
    const cl=state.clients.find(c=>c.id===state.currentClientId);
    if(cl)main.appendChild(ClientDetailPanel(cl,true));
  } else {
    const hint=document.createElement('div');hint.className='panel';
    hint.innerHTML=`<div class="empty">Select a client from the left to view their account.</div>`;
    main.appendChild(hint);
  }
  layout.appendChild(main);
  wrap.appendChild(layout);

  sidebar.querySelectorAll('.client-item').forEach(el=>{
    el.onclick=async()=>{
      const id=el.dataset.id;state.currentClientId=id;
      await loadRecords(id);await loadChat(id);await loadTransactions(id);render();
    };
  });
  sidebar.querySelector('#acb').onclick=()=>{state.modal='addClient';render();};
  return wrap;
}

/* ===== CLIENT DETAIL PANEL ===== */
function ClientDetailPanel(client,isAdmin){
  const calc=computeLedger(client);
  const host=document.createElement('div');

  /* Stats */
  const info=document.createElement('div');info.className='panel';
  const owL=calc.own==='abuzar'?'Abuzar only':calc.own==='azfar'?'Azfar only':'Shared';
  const spN=calc.own==='shared'?` (Abuzar ${calc.aSplit}% / Azfar ${100-calc.aSplit}% of cut)`:'';
  info.innerHTML=`
    <div class="panel-title">
      <span>${esc(client.name)} <span class="sub">${esc(client.email)} \u00b7 joined ${client.joinDate}</span></span>
      ${isAdmin?'<button class="btn btn-ghost btn-sm" id="ecb">Edit</button>':''}
    </div>
    ${isAdmin?`<div style="font-size:12px;color:var(--text-faint);margin-bottom:14px;">Client keeps ${calc.cPct}% \u00b7 ${owL}${spN}</div>`:''}
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Current balance</div><div class="stat-value mono">${fmtM(calc.currentBalance)}</div></div>
      <div class="stat-card"><div class="stat-label">Initial deposit</div><div class="stat-value mono">${fmtM(client.initialDeposit)}</div></div>
      <div class="stat-card"><div class="stat-label">Total profit earned</div><div class="stat-value green mono">${fmtM(calc.totalCProfit)}</div></div>
      ${isAdmin&&calc.own!=='azfar'?`<div class="stat-card"><div class="stat-label">Abuzar's pool</div><div class="stat-value green mono">${fmtM(calc.abPool)}</div></div>`:''}
      ${isAdmin&&calc.own!=='abuzar'?`<div class="stat-card"><div class="stat-label">Azfar's pool</div><div class="stat-value green mono">${fmtM(calc.azPool)}</div></div>`:''}
    </div>`;
  host.appendChild(info);
  if(isAdmin){info.querySelector('#ecb')?.addEventListener('click',()=>{state.modal='editClient';render();});}

  /* Add weekly result (admin) */
  if(isAdmin){
    const ar=document.createElement('div');ar.className='panel';
    const now=new Date();
    ar.innerHTML=`<div class="panel-title">Add result <span class="sub">gross %, before the ${calc.cPct}/${100-calc.cPct} split</span></div>
      <div class="row">
        <div class="field"><label>Date</label><input id="rd" type="date" value="${now.toISOString().slice(0,10)}"></div>
        <div class="field"><label>Gross %</label><input id="rp" type="number" step="0.01" placeholder="e.g. 4.5"></div>
      </div>
      <button class="btn btn-primary" id="srb">Save</button>`;
    ar.querySelector('#srb').onclick=async()=>{
      const date=ar.querySelector('#rd').value;
      const pct=parseFloat(ar.querySelector('#rp').value);
      if(!date){alert('Pick a date.');return;}
      if(isNaN(pct)){alert('Enter a valid percentage.');return;}
      const existing=state.records[client.id]||[];
      if(existing.find(r=>r.date===date)){
        if(!confirm('A record for this date already exists. Replace it?'))return;
      }
      const filtered=existing.filter(r=>r.date!==date);
      filtered.push({id:uid(),date,pct,addedAt:Date.now()});
      state.records[client.id]=filtered;
      await sSet('records:'+client.id,filtered);
      render();
    };
    host.appendChild(ar);
  }

  /* Weekly ledger */
  const lp=document.createElement('div');lp.className='panel';
  const pRows=calc.ledger.filter(r=>r._ev==='profit').slice().reverse();
  let rows='';
  if(!pRows.length){
    rows=`<tr><td colspan="${isAdmin?7:5}" class="empty">No weekly results yet.</td></tr>`;
  } else {
    pRows.forEach(r=>{
      rows+=`<tr>
        <td>${r.date?new Date(r.date+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'-'}</td>
        <td><span class="pill ${r.pct>=0?'up':'down'}">${fmtP(r.pct)}</span></td>
        <td class="mono">${fmtM(r.before)}</td>
        <td class="mono" style="color:var(--green)">+${fmtM(r.cGain)}</td>
        <td class="mono">${fmtM(r.after)}</td>
        ${isAdmin&&calc.own!=='azfar'?`<td class="mono">${fmtM(r.abAfter)}</td>`:''}
        ${isAdmin&&calc.own!=='abuzar'?`<td class="mono">${fmtM(r.azAfter)}</td>`:''}
      </tr>`;
    });
  }
  lp.innerHTML=`<div class="panel-title">Ledger</div>
    <table><thead><tr><th>Date</th><th>Gross return</th><th>Balance before</th><th>Your profit (${calc.cPct}%)</th><th>Balance after</th>${isAdmin&&calc.own!=='azfar'?'<th>Abuzar pool</th>':''}${isAdmin&&calc.own!=='abuzar'?'<th>Azfar pool</th>':''}</tr></thead>
    <tbody>${rows}</tbody></table>`;
  host.appendChild(lp);

  /* Transaction history */
  const txns=state.transactions[client.id]||[];
  if(txns.length){
    const tp=document.createElement('div');tp.className='panel';
    let tr2='';
    txns.slice().sort((a,b)=>b.requestedAt-a.requestedAt).forEach(t=>{
      tr2+=`<tr class="${t.type==='deposit'?'txn-dep':'txn-wd'}">
        <td style="text-transform:capitalize;font-weight:500;">${t.type}</td>
        <td class="mono" style="color:${t.type==='deposit'?'var(--green)':'var(--amber)'}">${t.type==='deposit'?'+':'\u2212'}${fmtM(t.amount)}</td>
        <td><span class="pill ${t.status}">${t.status}</span></td>
        <td style="font-size:12px;color:var(--text-faint);">${new Date(t.requestedAt).toLocaleDateString()}</td>
        ${t.note?`<td style="font-size:12px;color:var(--text-dim);">${esc(t.note)}</td>`:'<td></td>'}
      </tr>`;
    });
    tp.innerHTML=`<div class="panel-title">Deposit & withdrawal history</div>
      <table><thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>Requested</th><th>Note</th></tr></thead>
      <tbody>${tr2}</tbody></table>`;
    host.appendChild(tp);
  }

  /* Chat */
  const cp=document.createElement('div');cp.className='panel';
  cp.innerHTML=`<div class="panel-title">Messages ${isAdmin?'with '+esc(client.name):'with your advisor'}</div>`;

  if(!isAdmin){
    const rb=document.createElement('div');rb.className='req-btns';
    rb.innerHTML=`<button class="btn btn-primary btn-sm" id="drb" style="flex:1">+ Request Deposit</button>
                  <button class="btn btn-amber btn-sm" id="wrb" style="flex:1">\u2212 Request Withdrawal</button>`;
    cp.appendChild(rb);
    rb.querySelector('#drb').onclick=()=>{state.modal={type:'reqTxn',txnType:'deposit',clientId:client.id};render();};
    rb.querySelector('#wrb').onclick=()=>{state.modal={type:'reqTxn',txnType:'withdrawal',clientId:client.id};render();};
  }

  const chatBox=document.createElement('div');chatBox.className='chat-box';
  const msgsHost=document.createElement('div');msgsHost.className='chat-msgs';
  const msgs=state.chats[client.id]||[];

  if(!msgs.length){msgsHost.innerHTML=`<div class="empty">No messages yet.</div>`;}
  else{
    msgs.forEach(m=>{
      const mine=isAdmin?(m.sender==='admin'):(m.sender==='client');
      const row=document.createElement('div');row.className='msg-row '+(mine?'mine':'');
      if(m.msgType==='ticket'){
        const txn=(state.transactions[client.id]||[]).find(t=>t.id===m.ticketId);
        const status=txn?txn.status:'pending';
        const tc=document.createElement('div');
        tc.innerHTML=`<div class="ticket">
          <div class="ticket-header">${m.ticketTxnType==='deposit'?'\uD83D\uDCE5 Deposit Request':'\uD83D\uDCE4 Withdrawal Request'}</div>
          <div class="ticket-amount ${m.ticketTxnType}">${fmtM(m.ticketAmount)}</div>
          ${m.ticketNote?`<div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">${esc(m.ticketNote)}</div>`:''}
          <div style="font-size:10px;color:var(--text-faint);margin-bottom:6px;">${new Date(m.ts).toLocaleString()}</div>
          <span class="pill ${status}">${status.toUpperCase()}</span>
          ${isAdmin&&status==='pending'?`<div class="ticket-actions">
            <button class="btn btn-primary btn-sm" data-tid="${m.ticketId}" data-action="approve">Approve</button>
            <button class="btn btn-danger btn-sm" data-tid="${m.ticketId}" data-action="reject">Reject</button>
          </div>`:''}
        </div>`;
        tc.querySelectorAll('[data-action]').forEach(btn=>{
          btn.onclick=async()=>{
            const tid=btn.dataset.tid,action=btn.dataset.action;
            const txns=state.transactions[client.id]||[];
            const t=txns.find(t=>t.id===tid);
            if(!t)return;
            t.status=action==='approve'?'approved':'rejected';
            t.processedAt=Date.now();
            state.transactions[client.id]=txns;
            await sSet('transactions:'+client.id,txns);
            render();
          };
        });
        row.appendChild(tc);
      } else {
        const el=document.createElement('div');el.className='msg '+(mine?'mine':'theirs');
        el.innerHTML=esc(m.text)+`<div class="msg-time">${new Date(m.ts).toLocaleString()}</div>`;
        row.appendChild(el);
      }
      msgsHost.appendChild(row);
    });
  }

  chatBox.appendChild(msgsHost);
  const ir=document.createElement('div');ir.className='chat-input-row';
  ir.innerHTML=`<input id="ci" placeholder="Type a message"><button class="btn btn-primary" id="cs">Send</button>`;
  chatBox.appendChild(ir);
  cp.appendChild(chatBox);
  host.appendChild(cp);
  setTimeout(()=>{msgsHost.scrollTop=msgsHost.scrollHeight;},0);

  const send=async()=>{
    const inp=ir.querySelector('#ci');
    const text=inp.value.trim();if(!text)return;
    const list=state.chats[client.id]||[];
    list.push({id:uid(),sender:isAdmin?'admin':'client',text,ts:Date.now()});
    state.chats[client.id]=list;
    await sSet('chat:'+client.id,list);
    inp.value='';render();
  };
  ir.querySelector('#cs').onclick=send;
  ir.querySelector('#ci').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
  return host;
}

/* ===== CLIENT VIEW ===== */
function ViewClient(){
  const wrap=document.createElement('div');wrap.className='app';
  const client=state.loggedClient;
  const top=document.createElement('div');top.className='topbar';
  top.innerHTML=`<div class="brand"><div class="brand-mark">A2</div><div class="brand-name">A2 Capital</div></div>
    <div class="topbar-right"><span>${esc(client.email)}</span><button class="btn btn-ghost btn-sm" id="lo">Log out</button></div>`;
  top.querySelector('#lo').onclick=()=>{state.view='login';state.loggedClient=null;render();};
  wrap.appendChild(top);
  wrap.appendChild(ClientDetailPanel(client,false));
  return wrap;
}

/* ===== MODALS ===== */
function renderModal(){
  if(!state.modal)return null;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.onclick=e=>{if(e.target===bg){state.modal=null;render();}};
  const modal=document.createElement('div');modal.className='modal';

  if(state.modal&&state.modal.type==='reqTxn'){
    const{txnType,clientId}=state.modal;
    modal.innerHTML=`<h3>${txnType==='deposit'?'Request a Deposit':'Request a Withdrawal'}</h3>
      <div class="field"><label>Amount (USD)</label><input id="ma" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="field"><label>Note (optional)</label><textarea id="mn" rows="2" placeholder="Any note for your advisor"></textarea></div>
      <div class="modal-actions">
        <button class="btn" id="m-cancel" style="flex:1">Cancel</button>
        <button class="btn ${txnType==='deposit'?'btn-primary':'btn-amber'}" id="m-save" style="flex:1">Submit request</button>
      </div>`;
    modal.querySelector('#m-save').onclick=async()=>{
      const amount=parseFloat(modal.querySelector('#ma').value);
      const note=modal.querySelector('#mn').value.trim();
      if(isNaN(amount)||amount<=0){alert('Enter a valid amount.');return;}
      const tid=uid();
      const txns=state.transactions[clientId]||[];
      txns.push({id:tid,type:txnType,amount,status:'pending',requestedAt:Date.now(),processedAt:null,note});
      state.transactions[clientId]=txns;
      await sSet('transactions:'+clientId,txns);
      const chats=state.chats[clientId]||[];
      chats.push({id:uid(),sender:'client',ts:Date.now(),msgType:'ticket',ticketId:tid,ticketTxnType:txnType,ticketAmount:amount,ticketNote:note,text:''});
      state.chats[clientId]=chats;
      await sSet('chat:'+clientId,chats);
      state.modal=null;render();
    };
  }

  else if(state.modal==='addClient'){
    modal.innerHTML=`<h3>Add a new client</h3>
      <div class="field"><label>Full name</label><input id="mn" placeholder="Client name"></div>
      <div class="field"><label>Email</label><input id="me" type="email" placeholder="name@email.com"></div>
      <div class="field"><label>Phone</label><input id="mph" placeholder="03xx-xxxxxxx"></div>
      <div class="row">
        <div class="field"><label>Join date</label><input id="mj" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Initial deposit (USD)</label><input id="md" type="number" step="0.01" placeholder="1000"></div>
      </div>
      <div class="field"><label>Client passcode <span class="badge-30">share with them</span></label><input id="mp" placeholder="Set a passcode"></div>
      <div class="field"><label>Client profit share (%) <span class="badge-30">100 = no fee</span></label><input id="mc" type="number" step="0.1" min="0" max="100" value="70"></div>
      <div class="field"><label>Whose client?</label>
        <select id="mo"><option value="shared">Shared (Abuzar + Azfar)</option><option value="abuzar">Abuzar only</option><option value="azfar">Azfar only</option></select>
      </div>
      <div class="field" id="sw"><label>Abuzar's share of the cut (%) <span class="badge-30">rest to Azfar</span></label><input id="ms" type="number" step="0.1" min="0" max="100" value="50"></div>
      <div class="modal-actions">
        <button class="btn" id="m-cancel" style="flex:1">Cancel</button>
        <button class="btn btn-primary" id="m-save" style="flex:1">Add client</button>
      </div>`;
    const os=modal.querySelector('#mo'),sw=modal.querySelector('#sw');
    const tog=()=>{sw.style.display=os.value==='shared'?'block':'none';};
    os.addEventListener('change',tog);tog();
    modal.querySelector('#m-save').onclick=async()=>{
      const name=modal.querySelector('#mn').value.trim();
      const email=modal.querySelector('#me').value.trim();
      const phone=modal.querySelector('#mph').value.trim();
      const joinDate=modal.querySelector('#mj').value;
      const deposit=parseFloat(modal.querySelector('#md').value);
      const pass=modal.querySelector('#mp').value.trim();
      const cPct=parseFloat(modal.querySelector('#mc').value);
      const own=modal.querySelector('#mo').value;
      const aSplit=parseFloat(modal.querySelector('#ms').value)||50;
      if(!name||!email||!pass||isNaN(deposit)){alert('Fill in name, email, passcode, and deposit.');return;}
      if(isNaN(cPct)||cPct<0||cPct>100){alert('Profit share must be 0-100.');return;}
      if(state.clients.find(c=>c.email.toLowerCase()===email.toLowerCase())){alert('Email already exists.');return;}
      const nc={id:uid(),name,email,phone,joinDate,initialDeposit:deposit,passcode:pass,clientProfitPct:cPct,ownerType:own,splitAbuzarPct:aSplit};
      const updated=[...state.clients,nc];state.clients=updated;
      await sSet('clients',updated);
      state.modal=null;state.currentClientId=nc.id;
      await loadRecords(nc.id);await loadChat(nc.id);await loadTransactions(nc.id);
      render();
    };
  }

  else if(state.modal==='editClient'){
    const cl=state.clients.find(c=>c.id===state.currentClientId);
    const cp=cl.clientProfitPct??70,co=cl.ownerType||'shared',cs=cl.splitAbuzarPct??50;
    modal.innerHTML=`<h3>Edit ${esc(cl.name)}</h3>
      <div class="field"><label>Full name</label><input id="mn" value="${esc(cl.name)}"></div>
      <div class="field"><label>Email</label><input id="me" value="${esc(cl.email)}"></div>
      <div class="field"><label>Phone</label><input id="mph" value="${esc(cl.phone||'')}"></div>
      <div class="field"><label>Client passcode</label><input id="mp" value="${esc(cl.passcode)}"></div>
      <div class="field"><label>Client profit share (%)</label><input id="mc" type="number" step="0.1" min="0" max="100" value="${cp}"></div>
      <div class="field"><label>Whose client?</label>
        <select id="mo"><option value="shared" ${co==='shared'?'selected':''}>Shared (Abuzar + Azfar)</option><option value="abuzar" ${co==='abuzar'?'selected':''}>Abuzar only</option><option value="azfar" ${co==='azfar'?'selected':''}>Azfar only</option></select>
      </div>
      <div class="field" id="sw"><label>Abuzar's share of the cut (%)</label><input id="ms" type="number" step="0.1" min="0" max="100" value="${cs}"></div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="m-delete" style="flex:1">Remove client</button>
        <button class="btn btn-primary" id="m-save" style="flex:1">Save</button>
      </div>
      <button class="btn btn-ghost" id="m-cancel" style="width:100%;margin-top:10px;">Cancel</button>`;
    const os2=modal.querySelector('#mo'),sw2=modal.querySelector('#sw');
    const tog2=()=>{sw2.style.display=os2.value==='shared'?'block':'none';};
    os2.addEventListener('change',tog2);tog2();
    modal.querySelector('#m-save').onclick=async()=>{
      const cPct=parseFloat(modal.querySelector('#mc').value);
      const spl=parseFloat(modal.querySelector('#ms').value)||50;
      if(isNaN(cPct)||cPct<0||cPct>100){alert('Profit share must be 0-100.');return;}
      cl.name=modal.querySelector('#mn').value.trim();
      cl.email=modal.querySelector('#me').value.trim();
      cl.phone=modal.querySelector('#mph').value.trim();
      cl.passcode=modal.querySelector('#mp').value.trim();
      cl.clientProfitPct=cPct;cl.ownerType=modal.querySelector('#mo').value;cl.splitAbuzarPct=spl;
      await sSet('clients',state.clients);state.modal=null;render();
    };
    modal.querySelector('#m-delete').onclick=async()=>{
      if(!confirm('Remove this client?'))return;
      state.clients=state.clients.filter(c=>c.id!==cl.id);
      await sSet('clients',state.clients);
      state.modal=null;state.currentClientId=null;render();
    };
  }

  modal.querySelector('#m-cancel')?.addEventListener('click',()=>{state.modal=null;render();});
  bg.appendChild(modal);return bg;
}

/* ===== MAIN RENDER ===== */
window.__render=function(){
  const root=document.getElementById('root');root.innerHTML='';
  let view;
  if(state.view==='login')view=ViewLogin();
  else if(state.view==='admin')view=ViewAdmin();
  else if(state.view==='client')view=ViewClient();
  root.appendChild(view);
  const m=renderModal();if(m)root.appendChild(m);
};
(async function init(){await loadAdminConfig();render();})();
</script>
</body>
</html>
